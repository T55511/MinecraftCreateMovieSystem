# trunk-ignore-all(prettier)
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    ports:
      - "5420:5432"
    volumes:
      - pgdata_v2:/var/lib/postgresql/data
      - ./v2/init-db:/docker-entrypoint-initdb.d # 初期SQLを実行

  api_v2:
    build: ./v2/api
    environment:
      - AUDIT_LOG_PATH=/app/logs/audit.log
      - DATABASE_URL=postgresql+psycopg2://postgres:postgres@db:5432/app
      - RESET_LOGS=1 # コンテナ起動時にログをリセット 0:しない 1:する
    ports:
      - "8010:8000"
    depends_on:
      - db
    command: >
      sh -c "python -m alembic -c alembic.ini upgrade head &&
            uvicorn main:app --host 0.0.0.0 --port 8010"
    volumes:
      # - ./backend/logs:/app/logs
      - ./logs:/app/logs

  web_v2:
    build: ./v2/web
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8010
    ports:
      - "3010:3000"
    depends_on:
      - api_v2

volumes:
  pgdata_v2:
